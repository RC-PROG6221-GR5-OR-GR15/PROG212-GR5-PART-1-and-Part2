name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test and Containerise
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Application/Marathon/Marathon.sln

      - name: Build solution
        run: dotnet build Application/Marathon/Marathon.sln --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test Application/Marathon/Marathon.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/**/*.trx

      - name: Build API Docker image
        run: docker build -f Application/Marathon/Marathon/Dockerfile -t raceday-api ./Application/Marathon

      - name: Build MVC Docker image
        run: docker build -f Application/Marathon/Maraton.mvc/Dockerfile -t raceday-mvc ./Application/Marathon
